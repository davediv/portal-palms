[project]
name = "portal-palms"
version = "1.0.0"
description = "Tear open a portal with both hands and see what an abstract English word actually means."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Five direct runtime dependencies. Nothing else ships in the hot path.
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26,<2.3",
    "opencv-python>=4.9",
    "moderngl>=5.10",
    "glfw>=2.7",
]

[project.optional-dependencies]
# Only needed to record clips. Falls back to an `ffmpeg` already on PATH.
recording = ["imageio-ffmpeg>=0.5"]

[project.scripts]
portal-palms = "main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.0",
    "pillow>=10.0",       # bakes the font atlas offline; never imported at runtime
    "pyinstaller>=6.10",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff
    "ANN",       # annotations
    "PTH",       # pathlib
    "PERF",      # perflint
]
ignore = [
    "ANN401",    # Any is required at a few C-extension boundaries
    "E741",      # `l` reads fine as a lerp/length local in shader-adjacent math
    "SIM108",    # ternaries are not always clearer in hot code
    "PERF203",   # try/except in loop is fine at init time
    # `config as C`, `shaders as S`, `gestures as G`. These appear on a large
    # fraction of the lines in the hot paths, and the single letters keep those
    # expressions readable at a glance. Deliberate, and consistent throughout.
    "N812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
"tools/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = true
# warn_unreachable is deliberately off. It is stricter than --strict, and it
# false-positives wherever a value is narrowed and then invalidated by a
# mutating method call -- which is most of the gesture and tracker tests.
files = ["main.py", "portal_palms", "tests", "tools"]

[[tool.mypy.overrides]]
# None of these ship type information.
module = ["cv2.*", "mediapipe.*", "moderngl.*", "glfw.*", "PIL.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
